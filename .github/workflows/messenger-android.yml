name: Vellivex Messenger alpha checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/messenger/**'
      - '.github/workflows/messenger-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/messenger/**'
      - '.github/workflows/messenger-android.yml'

permissions: {}

concurrency:
  group: messenger-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MATRIX_RUST_VERSION: '1.96.0'
  MATRIX_CARGO_NDK_VERSION: '4.1.2'
  MATRIX_ANDROID_NDK_VERSION: '29.0.14206865'

jobs:
  matrix-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    env:
      NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Fetch public source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Restore matching Matrix native output
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/messenger-native
          key: messenger-matrix-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('apps/messenger/sdk/build.sh', 'apps/messenger/sdk/sources.json', 'apps/messenger/sdk/peer-device-verification.patch') }}
      - name: Compile the pinned Matrix SDK for ${{ matrix.target }}
        id: native
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$MATRIX_ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$MATRIX_ANDROID_NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          rustup toolchain install "$MATRIX_RUST_VERSION" --profile minimal --no-self-update
          rustup target add --toolchain "$MATRIX_RUST_VERSION" "$NATIVE_TARGET"
          cargo "+$MATRIX_RUST_VERSION" install --locked --version "$MATRIX_CARGO_NDK_VERSION" cargo-ndk
          export RUSTUP_TOOLCHAIN="$MATRIX_RUST_VERSION"
          export VELLIVEX_SDK_BUILD_DIR="$RUNNER_TEMP/messenger-sdk-work"
          rm -rf -- "$RUNNER_TEMP/messenger-native"
          mkdir -p "$RUNNER_TEMP/messenger-native" "$RUNNER_TEMP/messenger-sdk-logs"
          bash apps/messenger/sdk/build.sh --native-only --target "$NATIVE_TARGET" \
            --output-dir "$RUNNER_TEMP/messenger-native" \
            2>&1 | tee "$RUNNER_TEMP/messenger-sdk-logs/$NATIVE_TARGET.log"
      - name: Share the native SDK build output with packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-native-${{ matrix.target }}-${{ env.CHECK_SHA }}
          path: ${{ runner.temp }}/messenger-native/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Cache the successful Matrix native output
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/messenger-native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Retain the native SDK build log
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-native-log-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-sdk-logs/${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 7

  matrix-sdk:
    needs: matrix-native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      aar_id: ${{ steps.upload-sdk.outputs.artifact-id }}
    steps:
      - name: Fetch public source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download the arm64 native SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: messenger-native-aarch64-linux-android-${{ env.CHECK_SHA }}
          path: ${{ runner.temp }}/messenger-native/aarch64-linux-android
          digest-mismatch: error
      - name: Download the x86-64 native SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: messenger-native-x86_64-linux-android-${{ env.CHECK_SHA }}
          path: ${{ runner.temp }}/messenger-native/x86_64-linux-android
          digest-mismatch: error
      - name: Generate SDK bindings and package both native libraries
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-34' "ndk;$MATRIX_ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$MATRIX_ANDROID_NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export VELLIVEX_SDK_BUILD_DIR="$RUNNER_TEMP/messenger-sdk-work"
          bundle="$RUNNER_TEMP/messenger-sdk"
          mkdir -p "$bundle" "$RUNNER_TEMP/messenger-sdk-logs"
          bash apps/messenger/sdk/build.sh --assemble-from "$RUNNER_TEMP/messenger-native" \
            --output "$bundle/vellivex-matrix-sdk.aar" \
            2>&1 | tee "$RUNNER_TEMP/messenger-sdk-logs/assemble.log"
          cd -- "$bundle"
          unzip -tq vellivex-matrix-sdk.aar
          sha256sum --check --strict vellivex-matrix-sdk.aar.sha256
          test -s vellivex-matrix-sdk.aar.provenance.json
          printf '%s\n' "$CHECK_SHA" > source-commit.txt
      - name: Upload the complete Matrix SDK AAR for reuse
        id: upload-sdk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-matrix-sdk-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-sdk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Require the SDK artifact ID
        shell: bash
        env:
          SDK_ARTIFACT_ID: ${{ steps.upload-sdk.outputs.artifact-id }}
        run: '[[ "$SDK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Retain the SDK packaging log
        if: ${{ !cancelled() && steps.package.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-matrix-sdk-assembly-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-sdk-logs/assemble.log
          if-no-files-found: warn
          retention-days: 7

  android-build:
    needs: matrix-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch public source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download the SDK AAR from this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.matrix-sdk.outputs.aar_id }}
          path: ${{ runner.temp }}/messenger-sdk
          merge-multiple: true
          digest-mismatch: error
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          javac -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Run JVM tests and lint and build both debug APKs
        working-directory: apps/messenger/android
        shell: bash
        run: |
          set -euo pipefail
          sdk_bundle="$RUNNER_TEMP/messenger-sdk"
          test "$(<"$sdk_bundle/source-commit.txt")" = "$CHECK_SHA"
          (cd -- "$sdk_bundle" && sha256sum --check --strict vellivex-matrix-sdk.aar.sha256)
          ./gradlew --no-daemon --console=plain "-PmatrixSdkAar=$sdk_bundle/vellivex-matrix-sdk.aar" \
            testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch public source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned Synapse dependency and run backend unit tests
        shell: bash
        working-directory: apps/messenger/server
        run: |
          set -euo pipefail
          python3.12 -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise email login through loopback Synapse
        shell: bash
        working-directory: apps/messenger/server
        run: |
          set -euo pipefail
          state_dir=$(mktemp -d)
          .venv/bin/python dev_server.py \
            --state-dir "$state_dir" --port 8008 --mailbox-port 8025 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
            rm -rf -- "$state_dir"
          }
          trap cleanup EXIT
          curl --noproxy '*' --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --max-time 3 http://127.0.0.1:8008/_matrix/client/versions >/dev/null
          .venv/bin/python tests/smoke.py --port 8008 --mailbox-port 8025 \
            --mailbox-key-file "$state_dir/mailbox-key"

  android-integration:
    needs: matrix-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch public source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download the SDK AAR from this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.matrix-sdk.outputs.aar_id }}
          path: ${{ runner.temp }}/messenger-sdk
          merge-multiple: true
          digest-mismatch: error
      - name: Enable hardware acceleration on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This runner has no KVM device for the Android integration test.'
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
      - name: Run Android instrumentation against local Synapse
        id: instrumentation
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdk_bundle="$RUNNER_TEMP/messenger-sdk"
          test "$(<"$sdk_bundle/source-commit.txt")" = "$CHECK_SHA"
          (cd -- "$sdk_bundle" && sha256sum --check --strict vellivex-matrix-sdk.aar.sha256)
          export ORG_GRADLE_PROJECT_matrixSdkAar="$sdk_bundle/vellivex-matrix-sdk.aar"
          bash apps/messenger/scripts/run-android-integration.sh "$RUNNER_TEMP/messenger-evidence"
      - name: Upload Android test reports and the empty-onboarding screenshot
        if: ${{ !cancelled() && steps.instrumentation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-android-test-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/messenger-evidence/MessengerOnboardingSmokeTest.log
            ${{ runner.temp }}/messenger-evidence/MessengerLocalSynapseTest.log
            ${{ runner.temp }}/messenger-evidence/vellivex-alpha-onboarding.png
          if-no-files-found: warn
          retention-days: 7
