name: Vellivex public availability
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-availability.yml'
      - 'scripts/live-availability.mjs'
permissions: {}
concurrency:
  group: public-availability
  cancel-in-progress: false
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public source without checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Check only public landing pages
        run: node scripts/live-availability.mjs
