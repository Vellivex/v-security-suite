name: Vellivex signed ARM64 APK acceptance

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Public GitHub release asset URL for the signed ARM64 app APK
        required: true
        type: string
      app_sha256:
        description: SHA-256 of the exact Android app APK
        required: true
        type: string
      instrumentation_url:
        description: Public URL for the synthetic instrumentation APK in the same release
        required: true
        type: string
      instrumentation_sha256:
        description: SHA-256 of the exact instrumentation APK
        required: true
        type: string
      signer_sha256:
        description: SHA-256 of the APK signing certificate shared by both APKs
        required: true
        type: string
  pull_request:
    paths:
      - 'apps/messenger/android/arm64-acceptance.json'

permissions: {}

concurrency:
  group: messenger-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  signed-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Fetch public test runner source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate exact signed APK inputs
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_SHA256: ${{ inputs.app_sha256 }}
          INSTRUMENTATION_URL: ${{ inputs.instrumentation_url }}
          INSTRUMENTATION_SHA256: ${{ inputs.instrumentation_sha256 }}
          SIGNER_SHA256: ${{ inputs.signer_sha256 }}
        run: |
          set -euo pipefail
          python3.12 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          keys = ('app_url', 'app_sha256', 'instrumentation_url', 'instrumentation_sha256', 'signer_sha256')
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              values = json.loads(Path('apps/messenger/android/arm64-acceptance.json').read_text())
          else:
              values = {key: os.environ[key.upper()] for key in keys}
          if set(values) != set(keys) or any(not isinstance(value, str) for value in values.values()):
              raise SystemExit('Expected two release asset URLs, two SHA-256 values and a signer SHA-256.')
          tags = set()
          for key in ('app_url', 'instrumentation_url'):
              url = urlsplit(values[key])
              paths = url.path.split('/')
              if (
                  not re.fullmatch(r'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.apk', values[key])
                  or '/'.join(paths[1:3]).casefold() != os.environ['GITHUB_REPOSITORY'].casefold()
              ):
                  raise SystemExit('Use public APK asset URLs from this GitHub repository.')
              tags.add(paths[5])
          if len(tags) != 1 or values['app_url'] == values['instrumentation_url']:
              raise SystemExit('Use two distinct APK assets from the same release tag.')
          for key in ('app_sha256', 'instrumentation_sha256', 'signer_sha256'):
              if not re.fullmatch(r'[0-9A-Fa-f]{64}', values[key]):
                  raise SystemExit(f'{key} must contain exactly 64 hexadecimal digits.')
              values[key] = values[key].lower()
          with Path(os.environ['GITHUB_ENV']).open('a') as target:
              for key in keys:
                  target.write(f'{key.upper()}={values[key]}\n')
          PY
      - name: Download and verify the signed APKs
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          mkdir -p "$RUNNER_TEMP/messenger-exact-apks" "$RUNNER_TEMP/messenger-arm64-evidence"
          cd -- "$RUNNER_TEMP/messenger-exact-apks"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 20 --max-time 300 "$APP_URL" --output app.apk
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 20 --max-time 300 "$INSTRUMENTATION_URL" --output instrumentation.apk
          printf '%s  app.apk\n%s  instrumentation.apk\n' "$APP_SHA256" "$INSTRUMENTATION_SHA256" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          for package in app.apk instrumentation.apk; do
            certificate=$("$tools/apksigner" verify --print-certs "$package" | \
              awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print tolower($2)}')
            test "$certificate" = "$SIGNER_SHA256"
          done
          app_report=$("$tools/aapt" dump badging app.apk)
          test_report=$("$tools/aapt" dump badging instrumentation.apk)
          grep -Eq "^package: name='com\.vellivex\.messenger\.alpha' versionCode='3' versionName='0\.1\.0-alpha03-test'" <<< "$app_report"
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$app_report"
          grep -Eq "^package: name='com\.vellivex\.messenger\.alpha\.test'" <<< "$test_report"
          {
            printf 'App URL: %s\nInstrumentation URL: %s\nSigning certificate SHA-256: %s\n' \
              "$APP_URL" "$INSTRUMENTATION_URL" "$SIGNER_SHA256"
            cat SHA256SUMS
            grep -E '^(package:|native-code:)' <<< "$app_report"
            grep -E '^package:' <<< "$test_report"
          } | tee "$RUNNER_TEMP/messenger-arm64-evidence/apk-inputs.txt"
      - name: Enable hardware acceleration on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This runner has no KVM device for Android instrumentation.'
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
      - name: Run the synthetic Synapse suite on the installed signed ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash apps/messenger/scripts/run-android-integration.sh "$RUNNER_TEMP/messenger-arm64-evidence" \
            "$RUNNER_TEMP/messenger-exact-apks/app.apk" "$RUNNER_TEMP/messenger-exact-apks/instrumentation.apk"
      - name: Upload APK identity, translation, and Android test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-signed-arm64-acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-arm64-evidence/
          if-no-files-found: warn
          retention-days: 7
