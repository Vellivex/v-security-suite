name: Vellivex signed ARM64 APK acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance_alpha:
        description: Reviewed signed-release manifest to exercise
        required: true
        type: choice
        default: alpha06
        options: [alpha06, alpha05]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/messenger/android/arm64-alpha05-acceptance.json'
      - 'apps/messenger/android/arm64-alpha06-acceptance.json'
      - 'apps/messenger/scripts/run-android-integration.sh'
      - '.github/workflows/messenger-arm64-apk.yml'

permissions: {}

concurrency:
  group: messenger-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MESSENGER_ACCEPTANCE_ALPHA: ${{ inputs.acceptance_alpha || 'alpha06' }}

jobs:
  signed-arm64-apk:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        previous_version: ${{ fromJSON(inputs.acceptance_alpha == 'alpha05' && '["", "2", "4"]' || '["", "2", "4", "5"]') }}
    env:
      APK_SCENARIO: ${{ matrix.previous_version && format('upgrade-alpha0{0}', matrix.previous_version) || 'fresh' }}
      PREVIOUS_APP_VERSION: ${{ matrix.previous_version }}
    steps:
      - name: Fetch public test runner source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate exact signed APK inputs
        shell: bash
        run: |
          set -euo pipefail
          python3.12 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          keys = ('app_url', 'app_sha256', 'instrumentation_url', 'instrumentation_sha256', 'signer_sha256')
          alpha = os.environ['MESSENGER_ACCEPTANCE_ALPHA']
          versions = {'alpha05': '5', 'alpha06': '6'}
          if alpha not in versions:
              raise SystemExit('Select the reviewed Alpha05 or Alpha06 release manifest.')
          version = versions[alpha]
          values = json.loads(Path(f'apps/messenger/android/arm64-{alpha}-acceptance.json').read_text())
          if set(values) != set(keys) or any(not isinstance(value, str) for value in values.values()):
              raise SystemExit('Expected two release asset URLs, two SHA-256 values and a signer SHA-256.')
          base = f'https://github.com/Vellivex/v-security-suite/releases/download/messenger-v0.1.0-{alpha}/Vellivex-Messenger-0.1.0-{alpha}'
          if values['app_url'] != base + '-arm64.apk' or values['instrumentation_url'] != base + '-synthetic-tests.apk':
              raise SystemExit('Use the two exact assets for the selected reviewed release.')
          for key in ('app_sha256', 'instrumentation_sha256', 'signer_sha256'):
              if not re.fullmatch(r'[0-9A-Fa-f]{64}', values[key]):
                  raise SystemExit(f'{key} must contain exactly 64 hexadecimal digits.')
              values[key] = values[key].lower()
          if values['signer_sha256'] != '3aac05cadcd0cb90dff2474118586d537ce45cf177f237aa90a84a6ed3400df2':
              raise SystemExit('The Messenger signing identity must remain unchanged.')
          previous = os.environ['PREVIOUS_APP_VERSION']
          originals = {
              '2': ('alpha02', '592c00d453510b3a1ec9ff73d6f987819a6bfdfd6d7cdb43365bcc36bd108c2b'),
              '4': ('alpha04', 'a3c215607533f82d7aee623254928b27b5e454e79ef2c074550aff234e8c116a'),
              '5': ('alpha05', '6a4a72c3ad0c08ac74afa17af145a80f40fd4287ff7dabe77ef114c401366fef'),
          }
          previous_url, previous_hash = '', ''
          if previous:
              if previous not in originals or int(previous) >= int(version):
                  raise SystemExit('The upgrade source must be a supported earlier original release.')
              previous_alpha, previous_hash = originals[previous]
              previous_url = f'https://github.com/Vellivex/v-security-suite/releases/download/messenger-v0.1.0-{previous_alpha}/Vellivex-Messenger-0.1.0-{previous_alpha}-arm64.apk'
          with Path(os.environ['GITHUB_ENV']).open('a') as target:
              for key in keys:
                  target.write(f'{key.upper()}={values[key]}\n')
              target.write(f'APP_VERSION_CODE={version}\nAPP_VERSION_NAME=0.1.0-{alpha}-test\n')
              target.write(f'PREVIOUS_APP_URL={previous_url}\nPREVIOUS_APP_SHA256={previous_hash}\n')
          PY
      - name: Download and verify the signed APKs
        shell: bash
        run: |
          set -euo pipefail
          case "$APK_SCENARIO:$PREVIOUS_APP_VERSION" in
            fresh:|upgrade-alpha02:2|upgrade-alpha04:4|upgrade-alpha05:5) ;;
            *) printf '%s\n' 'Unexpected signed-APK validation scenario.' >&2; exit 1 ;;
          esac
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          mkdir -p "$RUNNER_TEMP/messenger-exact-apks" "$RUNNER_TEMP/messenger-arm64-evidence"
          cd -- "$RUNNER_TEMP/messenger-exact-apks"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 20 --max-time 300 "$APP_URL" --output app.apk
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 20 --max-time 300 "$INSTRUMENTATION_URL" --output instrumentation.apk
          printf '%s  app.apk\n%s  instrumentation.apk\n' "$APP_SHA256" "$INSTRUMENTATION_SHA256" > SHA256SUMS
          packages=(app.apk instrumentation.apk)
          if [[ -n "$PREVIOUS_APP_VERSION" ]]; then
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --connect-timeout 20 --max-time 300 "$PREVIOUS_APP_URL" --output previous.apk
            printf '%s  previous.apk\n' "$PREVIOUS_APP_SHA256" >> SHA256SUMS
            packages+=(previous.apk)
          fi
          sha256sum --check --strict SHA256SUMS
          for package in "${packages[@]}"; do
            certificate=$("$tools/apksigner" verify --print-certs "$package" | \
              awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print tolower($2)}')
            test "$certificate" = "$SIGNER_SHA256"
          done
          app_report=$("$tools/aapt" dump badging app.apk)
          test_report=$("$tools/aapt" dump badging instrumentation.apk)
          grep -Fq "package: name='com.vellivex.messenger.alpha' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" <<< "$app_report"
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$app_report"
          grep -Eq "^package: name='com\.vellivex\.messenger\.alpha\.test'" <<< "$test_report"
          if [[ -n "$PREVIOUS_APP_VERSION" ]]; then
            previous_report=$("$tools/aapt" dump badging previous.apk)
            grep -Eq "^package: name='com\.vellivex\.messenger\.alpha' versionCode='$PREVIOUS_APP_VERSION' versionName='0\.1\.0-alpha0${PREVIOUS_APP_VERSION}-test'" <<< "$previous_report"
            grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$previous_report"
          fi
          {
            printf 'Validation scenario: %s\n' "$APK_SCENARIO"
            printf 'App URL: %s\nInstrumentation URL: %s\nSigning certificate SHA-256: %s\n' \
              "$APP_URL" "$INSTRUMENTATION_URL" "$SIGNER_SHA256"
            cat SHA256SUMS
            grep -E '^(package:|native-code:)' <<< "$app_report"
            grep -E '^package:' <<< "$test_report"
            if [[ -n "$PREVIOUS_APP_VERSION" ]]; then
              printf 'Previous app URL: %s\nPrevious version code: %s\n' "$PREVIOUS_APP_URL" "$PREVIOUS_APP_VERSION"
              grep -E '^(package:|native-code:)' <<< "$previous_report"
            fi
          } | tee "$RUNNER_TEMP/messenger-arm64-evidence/apk-inputs.txt"
      - name: Enable hardware acceleration on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This runner has no KVM device for Android instrumentation.'
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
      - name: Run the synthetic Synapse suite on the installed signed ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          apks="$RUNNER_TEMP/messenger-exact-apks"
          arguments=("$RUNNER_TEMP/messenger-arm64-evidence" "$apks/app.apk" "$apks/instrumentation.apk")
          if [[ -n "$PREVIOUS_APP_VERSION" ]]; then
            arguments+=("$apks/previous.apk" "$PREVIOUS_APP_VERSION")
          fi
          bash apps/messenger/scripts/run-android-integration.sh "${arguments[@]}"
      - name: Upload APK identity, translation, and Android test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-signed-arm64-${{ env.MESSENGER_ACCEPTANCE_ALPHA }}-${{ env.APK_SCENARIO }}-acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-arm64-evidence/
          if-no-files-found: warn
          retention-days: 7
