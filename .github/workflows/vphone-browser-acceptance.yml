name: Vellivex VPhone local workspace browser acceptance
on:
  schedule:
    - cron: '41 8 * * 3'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vphone-browser-acceptance.yml'
      - 'scripts/vphone-browser-workspace.mjs'
permissions: {}
concurrency:
  group: vellivex-vphone-browser-qa
  cancel-in-progress: true
jobs:
  local-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Fetch public source without GitHub credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned browser automation library
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.65.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test fictional contacts and unsent drafts in real Chromium
        run: node scripts/vphone-browser-workspace.mjs
