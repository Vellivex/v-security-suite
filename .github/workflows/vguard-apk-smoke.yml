name: Vellivex VGuard APK verification
# One-off selective enforcement branch smoke test. Do not merge into main.
# Final finite shared-identity, metadata/export and system-recovery batch.
on:
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Run optional Android 15 emulator installation and launch'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - '.github/workflows/vguard-apk-smoke.yml'
      - 'scripts/vguard-apk-install-smoke.sh'
      - 'scripts/vguard-selective-emulator-smoke.sh'
      - 'scripts/vguard-core-lifecycle.sh'
      - 'scripts/vguard-final-lifecycle.sh'
      - 'scripts/vguard-activity-flow.sh'
      - 'scripts/vguard-system-recovery.sh'
      - 'scripts/vguard-persistent-check.py'
      - 'apps/vguard/device-qa/Probe.java'
      - 'apps/vguard/device-qa/protocol-server.py'
permissions: {}
concurrency:
  group: vellivex-vguard-public-package
  cancel-in-progress: true
jobs:
  apk-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        acceptance: [remaining]
    env:
      VGUARD_PROBE_BASELINES: 'true'
      VGUARD_PROBE_ENFORCEMENT: 'true'
      VGUARD_CORE_ONLY: 'true'
      VGUARD_FINAL_ONLY: 'true'
      VGUARD_REMAINING_ONLY: 'true'
      VGUARD_RUN_EMULATOR: ${{ github.ref_name == 'vellivex/vguard-selective-acceptance' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.emulator && 'true' || 'false') }}
    steps:
      - name: Fetch public test source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify APK checksum, signature, permissions and optional existing emulator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/vguard-apk-install-smoke.sh | tee "$RUNNER_TEMP/vguard-protocol-acceptance.log"
          grep -Fqx 'PASS VGuard: emulator remaining UI and recovery acceptance completed.' "$RUNNER_TEMP/vguard-protocol-acceptance.log"
