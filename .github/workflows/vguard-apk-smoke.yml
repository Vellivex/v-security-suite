name: Vellivex VGuard download access and source checks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vguard-apk-smoke.yml'
      - 'scripts/vguard-apk-install-smoke.sh'
      - 'scripts/vguard-download-access.mjs'
      - 'scripts/vguard-source-regressions.sh'
      - 'tests/vguard-download-access.test.mjs'
permissions: {}
concurrency:
  group: vellivex-vguard-public-package
  cancel-in-progress: true
jobs:
  access-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Fetch public test source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify anonymous installer download requires email sign-in
        run: node scripts/vguard-download-access.mjs
      - name: Verify pinned public source archive and run source regressions
        shell: bash
        run: bash scripts/vguard-source-regressions.sh
