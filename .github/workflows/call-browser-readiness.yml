name: Vellivex Call public audio readiness
on:
  schedule:
    - cron: '19 9 * * 6'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/call-browser-readiness.yml'
      - 'scripts/call-browser-readiness.mjs'
permissions: {}
concurrency:
  group: vellivex-call-public-readiness
  cancel-in-progress: true
jobs:
  audio-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Fetch public test source without account credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned browser automation library
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.65.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check free calling readiness without signing in or connecting
        run: node scripts/call-browser-readiness.mjs
