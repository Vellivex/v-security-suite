name: Security regression checks
# Invoked by the required public-identity workflow. That required job explicitly
# fails if this reusable workflow fails, is skipped, or is cancelled.
on: [workflow_call]
permissions: {}
jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public source without a persistent credential
        shell: bash
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$AUDIT_HEAD_SHA"
          git checkout --detach FETCH_HEAD
      - name: Select Node 24 for SQLite-backed authentication regressions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Web crypto, private feedback and sensitive-session regressions
        run: node --test tests/*.test.mjs
      - name: Frozen fictional mobile fixtures and authentication expectations
        run: node tests/fixtures/mobile/verify.mjs
      - name: Native parser, rule, engine and lifecycle regressions on host stubs
        run: bash apps/vguard/tests/adversarial/run-adversarial-tests.sh
      - name: Independent CSV parser checks
        run: python3 apps/vguard/validation/UI-Logic-Checks.py
      - name: Native source fingerprints and release policy (APK absent in public source checkout)
        run: python3 scripts/verify-vguard-release.py

      - name: QR dependency source and generated-runtime verification
        run: node scripts/verify-vendor.mjs
