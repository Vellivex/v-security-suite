name: Vellivex Messenger live two-app acceptance

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Reviewed exact installer profile
        required: true
        type: choice
        default: alpha08-release
        options: [alpha09-release, alpha08-release, alpha07-release, alpha06-test]
      installation_scenario:
        description: Fresh apps, or recover one preserved Alpha07 session by updating it
        required: true
        type: choice
        default: fresh
        options: [fresh, upgrade-alpha07]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/messenger/android-app-to-app/app/src/androidTest/java/com/vellivex/messenger/a2a/MessengerLiveAppToAppTest.kt'
      - 'apps/messenger/android-app-to-app/app/src/main/java/com/vellivex/messenger/a2a/SignInObservation.java'
      - 'apps/messenger/android-app-to-app/app/src/main/java/com/vellivex/messenger/a2a/ReleaseProfile.kt'
      - 'apps/messenger/android-app-to-app/app/src/test/java/com/vellivex/messenger/a2a/ReleaseProfileTest.kt'
      - 'apps/messenger/android-app-to-app/app/src/test/java/com/vellivex/messenger/a2a/SignInObservationTest.java'
      - 'apps/messenger/scripts/live-input-*'
      - 'apps/messenger/scripts/live-release-profile.py'
      - 'apps/messenger/scripts/live-preserved-session-update.py'
      - 'apps/messenger/android/arm64-alpha0*-live-acceptance.json'
      - 'apps/messenger/android/universal-alpha09-live-acceptance.json'
      - 'apps/messenger/scripts/tests/test-live-release-profile.py'
      - 'apps/messenger/scripts/tests/test-live-preserved-session-update.py'
      - 'apps/messenger/scripts/live-app-to-app-coordinator.py'
      - 'apps/messenger/scripts/run-android-live-app-to-app.sh'
      - 'apps/messenger/scripts/tests/test-live-input-envelope.mjs'
      - 'apps/messenger/scripts/tests/test-live-input-coordinator.py'
      - '.github/workflows/messenger-live-app-to-app.yml'

permissions: {}

concurrency:
  group: messenger-live-two-app-${{ github.run_id }}
  cancel-in-progress: false

env:
  CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MESSENGER_LIVE_PROFILE: ${{ inputs.release_profile || (github.head_ref == 'test/messenger-alpha09-x86-acceptance' && 'alpha09-release') || 'alpha08-release' }}
  MESSENGER_LIVE_SCENARIO: ${{ inputs.installation_scenario || 'fresh' }}

jobs:
  check-interface-driver:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch the proposed driver without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" == 'Vellivex/v-security-suite' ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test observation privacy and build the independent driver
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/messenger/scripts/tests/test-live-input-coordinator.py
          python3 apps/messenger/scripts/tests/test-live-release-profile.py
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
          cd apps/messenger/android-app-to-app
          ../android/gradlew --no-daemon --console=plain --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

  two-live-installed-apps:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref != 'test/messenger-alpha09-x86-acceptance' || github.event.action == 'ready_for_review'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the public reviewed source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" == 'Vellivex/v-security-suite' ]]
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD

      - name: Verify sealed-input isolation
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/messenger/scripts/tests/test-live-input-envelope.mjs
          python3 apps/messenger/scripts/tests/test-live-input-coordinator.py
          python3 apps/messenger/scripts/tests/test-live-release-profile.py
          python3 apps/messenger/scripts/tests/test-live-preserved-session-update.py

      - name: Prepare Android tools and verify the selected exact installer
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
          mkdir -p "$RUNNER_TEMP/messenger-live-inputs" "$RUNNER_TEMP/messenger-live-evidence"
          if [[ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" == test/messenger-alpha09-x86-acceptance ]]; then
            [[ "$MESSENGER_LIVE_PROFILE:$MESSENGER_LIVE_SCENARIO" == alpha09-release:fresh ]]
          fi
          case "$MESSENGER_LIVE_PROFILE:$MESSENGER_LIVE_SCENARIO" in
            alpha06-test:fresh|alpha07-release:fresh|alpha08-release:fresh|alpha08-release:upgrade-alpha07|alpha09-release:fresh) ;;
            *) echo '::error::Unsupported live installer/scenario combination.'; exit 1 ;;
          esac
          python3.12 apps/messenger/scripts/live-release-profile.py download \
            "$MESSENGER_LIVE_PROFILE" "$RUNNER_TEMP/messenger-live-inputs/app.apk"
          if [[ "$MESSENGER_LIVE_SCENARIO" == upgrade-alpha07 ]]; then
            python3.12 apps/messenger/scripts/live-release-profile.py download \
              alpha07-release "$RUNNER_TEMP/messenger-live-inputs/previous-alpha07.apk"
          fi

      - name: Build the independently signed live interface driver
        working-directory: apps/messenger/android-app-to-app
        shell: bash
        run: |
          set -euo pipefail
          ../android/gradlew --no-daemon --console=plain --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable hardware acceleration and create the ephemeral input key
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]]
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
          mkdir -m 700 "$RUNNER_TEMP/messenger-live-control"
          mkdir -m 700 "$RUNNER_TEMP/messenger-live-public-key"
          node apps/messenger/scripts/live-input-envelope.mjs init \
            "$RUNNER_TEMP/messenger-live-private" \
            "$RUNNER_TEMP/messenger-live-public-key/public-key.json" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CHECK_SHA"

      - name: Publish only the run-bound public input key
        if: env.MESSENGER_LIVE_PROFILE != 'alpha09-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-live-public-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-live-public-key/public-key.json
          if-no-files-found: error
          retention-days: 1

      - name: Start the two apps and prepare the verified input handoff
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/messenger-live-control"
          driver=apps/messenger/android-app-to-app/app/build/outputs/apk
          # The process retains RUNNER_TRACKING_ID. Normal job cleanup remains enabled.
          # A private supervisor records the result even when the test fails.
          setsid bash -c '
            result_file=$1
            shift
            set +e
            "$@"
            result=$?
            printf "%s\n" "$result" > "$result_file"
            exit "$result"
          ' _ "$control/exit" bash apps/messenger/scripts/run-android-live-app-to-app.sh \
            "$RUNNER_TEMP/messenger-live-evidence/execution" \
            "$RUNNER_TEMP/messenger-live-inputs/app.apk" \
            "$driver/debug/app-debug.apk" "$driver/androidTest/debug/app-debug-androidTest.apk" \
            "$RUNNER_TEMP/messenger-live-private" --profile "$MESSENGER_LIVE_PROFILE" > "$control/driver.log" 2>&1 &
          printf '%s\n' "$!" > "$control/pid"
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if [[ "$MESSENGER_LIVE_PROFILE" == alpha09-release && -f "$RUNNER_TEMP/messenger-live-evidence/execution/native-install-ready.txt" ]]; then
              echo 'Both native x86_64 installs passed exact byte, package and separation checks.'
              exit 0
            fi
            if [[ "$MESSENGER_LIVE_PROFILE" != alpha09-release && -f "$RUNNER_TEMP/messenger-live-evidence/execution/code-handoff.json" ]]; then
              echo 'Both real apps are ready for their privately supplied received email codes.'
              exit 0
            fi
            if [[ -f "$control/exit" ]]; then
              echo '::error::The live apps stopped before both email-code screens were ready.'
              exit 1
            fi
            sleep 2
          done
          echo '::error::The bounded live-code preparation window expired.'
          exit 1

      - name: Publish both Alpha09 native-install receipts
        if: env.MESSENGER_LIVE_PROFILE == 'alpha09-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: messenger-live-native-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/messenger-live-evidence/execution/installed-apps.txt
            ${{ runner.temp }}/messenger-live-evidence/execution/apk-identity.json
            ${{ runner.temp }}/messenger-live-evidence/execution/device-separation.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish only the Alpha09 run-bound public encryption key
        if: env.MESSENGER_LIVE_PROFILE == 'alpha09-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: messenger-live-public-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-live-public-key/public-key.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for both Alpha09 code screens after the private receiver is ready
        if: env.MESSENGER_LIVE_PROFILE == 'alpha09-release'
        shell: bash
        run: |
          set -euo pipefail
          limit=$((SECONDS + 900))
          until [[ -f "$RUNNER_TEMP/messenger-live-evidence/execution/code-handoff.json" ]]; do
            if [[ -f "$RUNNER_TEMP/messenger-live-control/exit" ]] || ((SECONDS >= limit)); then
              echo '::error::The paired private code-entry window closed.'
              exit 1
            fi
            sleep 2
          done

      - name: Publish the sanitized code-entry handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-live-code-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/messenger-live-evidence/execution/code-handoff.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for both real production conversations and app restarts
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/messenger-live-control"
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if [[ -f "$control/exit" ]]; then
              result=$(<"$control/exit")
              [[ "$result" =~ ^[0-9]{1,3}$ ]]
              if [[ "$result" != 0 ]]; then
                echo '::error::The live two-app acceptance did not complete successfully.'
                exit 1
              fi
              echo 'PASS: both released apps completed real-email production messaging and signed out their disposable sessions.'
              exit 0
            fi
            sleep 2
          done
          echo '::error::The bounded live two-app execution window expired.'
          exit 1

      - name: Stop only this test process group and erase private temporary inputs
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/messenger-live-control"
          if [[ -f "$control/pid" ]]; then
            pid=$(<"$control/pid")
            [[ "$pid" =~ ^[0-9]+$ && "$pid" -gt 1 ]]
            if kill -0 -- "-$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              for _ in 1 2 3 4 5; do
                kill -0 -- "-$pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
            fi
          fi
          rm -rf -- "$RUNNER_TEMP/messenger-live-private" "$control"

      - name: Retain only sanitized live test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messenger-live-two-installed-apps-${{ env.MESSENGER_LIVE_PROFILE }}-${{ env.MESSENGER_LIVE_SCENARIO }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/messenger-live-evidence/execution/apk-identity.json
            ${{ runner.temp }}/messenger-live-evidence/execution/installed-apps.txt
            ${{ runner.temp }}/messenger-live-evidence/execution/device-separation.json
            ${{ runner.temp }}/messenger-live-evidence/execution/cold-restart.txt
            ${{ runner.temp }}/messenger-live-evidence/execution/upgrade-alpha07.json
            ${{ runner.temp }}/messenger-live-evidence/execution/installation-scenario.json
            ${{ runner.temp }}/messenger-live-evidence/execution/fresh-A.log
            ${{ runner.temp }}/messenger-live-evidence/execution/fresh-B.log
            ${{ runner.temp }}/messenger-live-evidence/execution/restart-A.log
            ${{ runner.temp }}/messenger-live-evidence/execution/restart-B.log
            ${{ runner.temp }}/messenger-live-evidence/execution/two-app-summary.json
            ${{ runner.temp }}/messenger-live-evidence/execution/code-handoff.json
          if-no-files-found: warn
          retention-days: 14
