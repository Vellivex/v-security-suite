name: Messenger signed Alpha11 update acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/messenger-alpha11-installed.yml'
      - '.github/scripts/test-installed-alpha11.py'
  workflow_dispatch:

permissions: {}

jobs:
  signed-android:
    if: >-
      github.repository == 'Vellivex/v-security-suite' &&
      (github.event_name != 'pull_request' || (github.head_ref == 'qa/messenger-alpha11-original-installer' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    env:
      CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch the reviewed source without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/Vellivex/v-security-suite.git
          git fetch --depth=1 origin "$CHECK_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install and open the exact original-signed APKs on Android 15
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-35;google_apis;x86_64'
          "$tools/sdkmanager" --install 'build-tools;36.0.0' 'platform-tools' emulator "$image"
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/installed-avd"
          mkdir -m 700 "$ANDROID_AVD_HOME"
          "$tools/avdmanager" create avd --name vellivex-installed --package "$image" <<< no
          "$ANDROID_HOME/emulator/emulator" -avd vellivex-installed -port 5554 -accel on -cores 2 -memory 2048 \
            -gpu swiftshader -no-window -no-audio -no-snapshot -no-boot-anim >"$RUNNER_TEMP/installed-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 .github/scripts/test-installed-alpha11.py
